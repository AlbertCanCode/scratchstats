{% extends "base.html" %}

{% block content %}
        <h1 id="main-header">Scratch Stats</h1>
        <p id="main-subheader">Enter a Scratch username below 👇</p>

        <form id="statsForm" data-mode="{{ view_mode }}" data-user1="{{ prefill1 or '' }}" data-user2="{{ prefill2 or '' }}">
            <div class="input-group">
                <input type="text" id="username1" name="username1" placeholder="e.g ChessProKing-TM" required>
                <input type="text" id="username2" name="username2" placeholder="e.g griffpatch">
            </div>
            <button type="submit" id="submitBtn">Get Stats</button>
        </form>

        <div id="stats"></div>
        <div id="result-actions" class="result-actions" hidden>
            <button type="button" class="action-btn" id="copyLinkBtn">🔗 Copy link</button>
            <button type="button" class="action-btn" id="downloadBtn">🖼️ Download image</button>
        </div>
{% endblock %}

{% block scripts %}
    <script src="{{ url_for('static', filename='app.js') }}"></script>
{% endblock %}
